[package]
name = "julia1"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Rust CPU/CUDA inference runtime for the Supersonic Labs Julia-1 decision model"
repository = "https://github.com/apiplant/julia1-rs"
readme = "README.md"
keywords = ["julia-1","decision-model","classification","routing","inference"]
categories = ["science","text-processing","command-line-utilities"]
exclude = ["assets/","bench/","examples/dino/game/","/.github/","/website/","/packaging/"]

[[bin]]
name = "julia1"
path = "src/bin/julia1.rs"
required-features = ["cli"]

[lib]
name = "julia1"
crate-type = ["rlib", "cdylib"]

[features]
# `cli` and `server` are on by default so `cargo install` gives the full `julia1` binary. A library
# dependency that only wants the engine should turn them off, which drops clap, ntex and tokio:
#   julia1 = { version = "...", default-features = false }
default = ["cli", "server"]
# Command-line parsing for the `julia1` binary.
cli = ["dep:clap"]
# The HTTP server (`julia1::server`, `julia1 serve`).
server = ["dep:ntex", "dep:tokio", "dep:ntex-http"]
cuda = ["dep:cudarc"]

[dependencies]
anyhow = "1"
gemm = "0.19"
half = "2"
libm = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "cublas", "cuda-version-from-build-system", "dynamic-loading"] }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
lru = "0.18.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
ureq = "2"
# onig is a C library; the browser build uses the pure-Rust regex engine instead.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# HTTP server (src/server.rs): ntex owns the worker threads and SIGINT/SIGTERM graceful shutdown; tokio
# supplies only the runtime-agnostic async Mutex/Semaphore used for the serial-execution queue.
ntex = { version = "3.12", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
# ntex 3.12.3 does not compile against ntex-http 1.3.0 (HeaderMap no longer implements FromIterator,
# which ntex's h2 client relies on), yet its own requirement is `>=1.2.0`; hold the resolver on 1.2.x.
ntex-http = { version = "~1.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1

[[test]]
name = "server"
required-features = ["server"]
