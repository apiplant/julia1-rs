// Fields for dists/stable/Release. apt-ftparchive fills in Date and the
// per-index checksums itself; these are the ones it cannot guess.
//
// `Suite` and `Codename` are both "stable" on purpose: the same .deb runs on
// every Debian and Ubuntu release we support, so per-distro suites would carry
// identical packages under different names. A sources.list entry pinned to
// `stable` keeps working across a distribution upgrade.
//
// The apt repository is shared by every apiplant project, so Origin/Label name
// the publisher rather than whichever project released last.
APT::FTPArchive::Release {
  Origin "apiplant";
  Label "apiplant";
  Suite "stable";
  Codename "stable";
  Architectures "amd64 arm64";
  Components "main";
  Description "apiplant releases";
};
